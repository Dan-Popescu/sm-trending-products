name: Verify pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate bounded runs from stalled executions created before the watchdog.
  group: verify-v4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    # Native source/restore checks and the actual two-image campaign run here.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: pipeline_test
          POSTGRES_DB: pipeline_test
          POSTGRES_PASSWORD: pipeline-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline_test -d pipeline_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://pipeline_test:pipeline-test-only@127.0.0.1:5432/pipeline_test
      TEST_DATABASE_URL: postgresql://pipeline_test:pipeline-test-only@127.0.0.1:5432/pipeline_test
      S3_BUCKET: sm-trends-ci
      S3_ENDPOINT_URL: http://127.0.0.1:5000
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      PIPELINE_NAMESPACE: testing
      COLLECTOR_BINARY: collector/target/debug/sm-collector
      POLARS_MAX_THREADS: "2"
      RAYON_NUM_THREADS: "2"
      DUCKDB_THREADS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned release verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Check release verifier installation
        run: cosign version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.23
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev --python 3.12
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            collector/target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml', 'collector/Cargo.lock', 'collector/Cargo.toml') }}-${{ hashFiles('collector/src/**') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml', 'collector/Cargo.lock', 'collector/Cargo.toml') }}-
      - name: Verify Rust collector
        run: |
          cargo fmt --manifest-path collector/Cargo.toml --check
          cargo clippy --locked --manifest-path collector/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path collector/Cargo.toml
          cargo build --locked --manifest-path collector/Cargo.toml
      - name: Verify Python formatting and lint
        run: |
          uv run --locked ruff format --check src tests scripts
          uv run --locked ruff check src tests scripts
      - name: Verify Python types
        timeout-minutes: 5
        run: uv run --locked mypy src
      - name: Verify native PostgreSQL behavior with watchdog
        # Includes bounded 12k-dataset and 50k-artifact retirement regressions.
        # The independently exercised commerce and recovery cases expand this suite.
        timeout-minutes: 20
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p output
          ulimit -c 0
          # Bound pytest itself and leave time to publish its diagnostic output.
          native_test_status=0
          timeout --verbose --signal=ABRT --kill-after=15s 19m \
            uv run --locked pytest -vv -ra --durations=15 \
            -o faulthandler_timeout=90 --junitxml=output/test-results.xml \
            >output/native-tests.log 2>&1 || native_test_status=$?
          cat output/native-tests.log
          exit "$native_test_status"
      - name: Verify controlled benchmark and quota exhaustion
        timeout-minutes: 5
        run: bash scripts/ci-benchmark.sh
      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh deploy/postgres/*.sh; do bash -n "$script"; done
      - name: Validate and build deployment
        env:
          POSTGRES_PASSWORD: pipeline-test-only
        run: |
          docker compose config --quiet
          docker compose build
      - name: Qualify actual two-image acquisition handover
        timeout-minutes: 5
        run: bash scripts/ci-continuity.sh
      - name: Rehearse isolated synthetic backup and restore
        run: scripts/ci-recovery.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            output/test-results.xml
            output/native-tests.log
            output/recovery-report.json
            output/offline-benchmark.json
            output/offline-benchmark.log
            output/offline-quota.json
            output/offline-quota.log
            output/continuity-docker-tests.xml
            output/continuity-fixture-images.json
            output/continuity-evidence/*.json
          if-no-files-found: ignore
