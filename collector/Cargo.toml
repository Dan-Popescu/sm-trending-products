[package]
name = "sm-collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Bounded TikTok collection and evidence normalization"

[dependencies]
chrono = { version = "=0.4.42", features = ["serde"] }
clap = { version = "=4.5.50", features = ["derive"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std"] }
tokio-postgres = "=0.7.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
